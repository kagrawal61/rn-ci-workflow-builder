name: CI

on:
  pull_request:
    branches:
      - master
      - develop

jobs:
  lib:
    name: Library (src)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint:ci

      - name: Type check
        run: yarn type-check

      - name: Format check
        run: yarn format:check

      - name: Tests
        run: yarn test --passWithNoTests --coverage=false

  app:
    name: App (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint:ci

      - name: Type check
        run: yarn type-check

      - name: Format check
        run: yarn format:check

      - name: Build
        run: yarn build
